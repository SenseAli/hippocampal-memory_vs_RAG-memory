[project]
name = "hippocampal-agent"
version = "0.1.0"
description = "Hippocampus-inspired memory system for LLM agents vs naive RAG, side-by-side"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "chromadb>=0.4.24",
  "sentence-transformers>=2.7",
  "requests>=2.31",
  "pypdf>=4.0",
  "numpy>=1.26",
  "tiktoken>=0.7",
  "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
